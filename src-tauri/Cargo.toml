[package]
name = "llm-chat"
version = "0.1.0"
description = "A lightweight LLM chat application"
authors = ["MathiasXII"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "dialog-open", "shell-open", "webkit2gtk-4.1" ] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
git2 = "0.20.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
