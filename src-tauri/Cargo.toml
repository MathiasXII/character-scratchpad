[package]
name = "character-scratch-pad"
version = "1.0.0"
description = "A desktop application for developing and testing AI characters against OpenAI-compatible chat APIs"
authors = ["MathiasXII"]
edition = "2021"

[lib]
name = "character_scratch_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
futures-util = "0.3"
git2 = "0.20"
lopdf = "0.40"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
