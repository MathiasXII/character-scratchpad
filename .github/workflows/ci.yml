name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust check & clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

    # .github/workflows/ci.yml (ref: 6c0a95b13f889c46fea0cba332a35c7bf2ee025b)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          pkg-config \
          libsoup2.4-dev \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf

      # Use the stable Rust toolchain and cache the registry + build artifacts
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # cargo check — verifies the crate compiles without producing a binary
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-features

      # clippy — lint for common mistakes and non-idiomatic code
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-features -- -D warnings
