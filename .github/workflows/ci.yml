name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust check & clippy
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Use the stable Rust toolchain and cache the registry + build artifacts
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: "ubuntu-22.04-v2"

      # cargo check — verifies the crate compiles without producing a binary
      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      # clippy — lint for common mistakes and non-idiomatic code
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # cargo test — run unit and integration tests
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  js-test:
    name: JS tests (vitest)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test
