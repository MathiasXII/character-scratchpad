<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Scratch Pad</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <div id="header-left">
        <div id="header-center">
          <span id="character-label">Characters</span>
          <select id="character-select" disabled>
            <option value="">No characters yet</option>
          </select>
          <button id="new-character-btn" title="New Character">+ Create Character</button>
        </div>
      </div>
      <div id="header-divider"></div>
<div id="header-right">
        <button id="clear-chat-btn" title="Clear chat">🗑 Clear</button>
        <button id="settings-btn" title="Settings">&#9881;</button>
      </div>
    </header>

    <main>
      <div id="left-pane">
        <div id="context-sidebar" class="context-sidebar">
          <div class="context-sidebar-header">
            <span id="context-sidebar-title">Files</span>
            <button id="context-add-btn" class="context-add-btn" title="Add context file">+</button>
          </div>
          <div id="context-file-list" class="context-file-list"></div>
          <div id="drop-overlay" class="drop-overlay hidden">
            <div class="drop-overlay-content">
              <span class="drop-overlay-icon">📁</span>
              <span class="drop-overlay-text">Drop file to add</span>
            </div>
          </div>
        </div>
        <div id="left-pane-content">
          <div id="save-error-banner" class="error-banner hidden">
            <span id="save-error-text">Error saving file</span>
            <button id="save-error-dismiss" title="Dismiss">&times;</button>
          </div>
          <div id="tab-bar">
            <button class="tab active" data-tab="instructions">Instructions</button>
            <button class="tab" data-tab="prompt">System Prompt</button>
            <button class="tab" data-tab="description">Description</button>
            <button class="tab" data-tab="first-response">First Response</button>
            <button class="tab" data-tab="context">Context</button>
          </div>
          <div id="editor" data-placeholder="Select a tab and start editing..."></div>
          <div id="token-counter">0 tokens</div>
          <div id="version-control-bar">
            <button id="git-history-btn" class="git-bar-control" title="View history">⏱ History</button>
            <span id="git-status-indicator" class="git-status-indicator"></span>
            <button id="git-commit-btn" class="git-bar-control" title="Save checkpoint" disabled>💾 Save checkpoint</button>
          </div>
          <div id="git-save-status" class="git-save-status">✓ Saved</div>
        </div>
      </div>
      <div id="pane-divider"></div>
      <div id="right-pane">
        <div id="chat-disabled-overlay" class="chat-disabled-overlay hidden">
          <div class="chat-disabled-content">
            <h2>Chat Unavailable</h2>
            <p>Set your <strong>API Key</strong>, <strong>Model</strong>, and <strong>API Endpoint</strong> in Settings to start chatting.</p>
            <button id="chat-disabled-settings-btn" title="Open Settings">&#9881; Open Settings</button>
          </div>
        </div>
        <div id="chat-container">
          <div id="messages"></div>
        </div>
        <footer>
          <div id="input-area">
            <textarea id="user-input" placeholder="Type a message..." rows="1"></textarea>
            <button id="resend-btn" class="action-btn" title="Resend" disabled>↻</button>
            <button id="send-btn" title="Send">&#10148;</button>
          </div>
        </footer>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="settings-close" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <label for="api-key">API Key</label>
        <input type="password" id="api-key" placeholder="sk-..." />

        <label for="model">Model</label>
        <div id="model-combobox" class="combobox">
          <input type="text" id="model" placeholder="gpt-4o-mini" autocomplete="off" />
          <button type="button" id="model-dropdown-btn" class="combobox-caret" disabled tabindex="-1" aria-label="Select model">&#9662;</button>
          <div id="model-dropdown" class="combobox-dropdown hidden"></div>
        </div>

        <label for="endpoint">API Endpoint</label>
        <input type="text" id="endpoint" placeholder="https://api.openai.com/v1" />

        <div class="setting-row">
          <label for="temperature">Temperature <span id="temperature-value">0.7</span></label>
          <input type="range" id="temperature" min="0" max="2" step="0.05" value="0.7" />
        </div>

        <div class="setting-row">
          <label for="top-p">Top P <span id="top-p-value">1.0</span></label>
          <input type="range" id="top-p" min="0" max="1" step="0.05" value="1.0" />
        </div>

        <label for="work-folder">Work Folder</label>
        <div id="work-folder-row">
          <input type="text" id="work-folder" placeholder="Path to characters folder..." readonly />
          <button id="browse-folder-btn" title="Browse">&#128193;</button>
        </div>

        <button id="save-settings">Save</button>
      </div>
    </div>
  </div>

  <!-- New Character Modal -->
  <div id="new-character-modal" class="modal hidden">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>New Character</h2>
        <button id="new-character-close" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <label for="new-character-name">Name</label>
        <input type="text" id="new-character-name" placeholder="Enter character name..." autofocus />
        <div class="modal-actions">
          <button id="new-character-cancel" class="btn-secondary">Cancel</button>
          <button id="new-character-create" class="btn-primary">Create</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Git History Modal -->
  <div id="git-history-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Version History</h2>
        <button id="git-history-close" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="git-history-list"></div>
      </div>
    </div>
  </div>

  <!-- Delete Context File Modal -->
  <div id="delete-context-modal" class="modal hidden">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>Delete File</h2>
        <button id="delete-context-close" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p id="delete-context-message" style="font-size:14px; color:var(--text-secondary); line-height:1.5;"></p>
        <div class="modal-actions">
          <button id="delete-context-cancel" class="btn-secondary">Cancel</button>
          <button id="delete-context-confirm" class="btn-primary" style="background:var(--error);">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="lib/dompurify.min.js"></script>
  <script src="lib/marked.min.js"></script>
  <script src="lib/editor-cm.bundle.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
